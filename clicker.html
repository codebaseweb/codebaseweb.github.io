<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Супер Кликер</title>
    <style>
        #main {
            text-align: center;
        }
        #score {
            font-size: 48px;
            font-weight: bolt;
        }
        #clickBtn {
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="main">
    <h1>Мой Кликер</h1>
    <p id="score">0</p>

    <!-- Главная кнопка для кликов -->
    <button id="clickBtn">Кликнуть!</button>
</div>

    <br><br>

<script>
    let count = 0;
    let btn = document.getElementById('clickBtn');
    let scoreDisplay = document.getElementById('score');
    btn.addEventListener('click', function() {
        count++;
        scoreDisplay.textContent = count;
    });
</script>
</body>
</html>
