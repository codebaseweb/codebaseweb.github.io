<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Супер Кликер</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; }
        #clickBtn { background: #28a745; color: white; font-weight: bold; }
        #upgradeBtn { background: #ffc107; color: black; }
        #upgradeBtn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Баланс: <span id="coins">0</span> 🪙</h1>
    <p>Авто-клик: +<span id="cps">0</span> в сек.</p>

    <!-- Главная кнопка для кликов -->
    <button id="clickBtn">Кликнуть!</button>

    <br><br>

    <!-- Кнопка магазина -->
    <button id="upgradeBtn" disabled>Купить Авто-кликер (Цена: 10 🪙)</button>

    <script src="clicker.js"></script>
</body>
</html>
