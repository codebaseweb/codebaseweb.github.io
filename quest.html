<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моя Игра</title>
  <style>
    body { background: #1a1a1a; color: #fff; font-family: monospace; text-align: center; margin-top: 50px; }
  </style>
</head>
<body>
  <h1>🏰 Приключение в подземелье</h1>
  <button id="actionBtn" onclick="nextTurn()">Исследовать (1 ход)</button>
  <div id="log" style="margin-top: 20px; border: 1px solid #444; padding: 15px; min-height: 100px;">
    Нажмите кнопку, чтобы начать путь...
  </div>

  <script>
    function nextTurn() {
      const events = ['Ничего не произошло...', 'Найден золотой!', 'Встречен монстр!'];
      const weights = [0.6, 0.3, 0.1]; // Шансы: 60% тишина, 30% золото, 10% враг

      // Симулируем choices() через случайное число
      const rand = Math.random();
      let event = events[0];
      if (rand > 0.6 && rand <= 0.9) event = events[1];
      else if (rand > 0.9) event = events[2];

      document.getElementById('log').innerText = event;
    }
</script>
</body>
</html>
